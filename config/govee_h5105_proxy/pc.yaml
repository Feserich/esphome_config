esphome:
  name: "pc-control"
  platformio_options:
   board_build.flash_mode: dio

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG


# Enable Home Assistant API
api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

switch:
  - platform: gpio
    pin: 3
    name: "PC power on/off"
    inverted: true
    id: relay
    on_turn_on:
    - delay: 500ms
    - switch.turn_off: relay

esp32_ble_tracker:
  on_ble_manufacturer_data_advertise:
    - mac_address: C7:35:33:33:66:73
      manufacturer_id: '0001'
      then:
        - lambda: |-
            const int basenum = (int16_t(x[2]) << 16) + (int16_t(x[3]) << 8) + int16_t(x[4]);
            const float temperature = (basenum / 10000.0f);
            const float humidity = (basenum % 1000) / 10.0f;
            const float battery_level = uint16_t(x[5]) / 1.0f;

            id(govee_1_temperature).publish_state(temperature);
            id(govee_1_humidity).publish_state(humidity);
            id(govee_1_battery).publish_state(battery_level);

    - mac_address: D6:35:33:33:60:76
      manufacturer_id: '0001'
      then:
        - lambda: |-
            const int basenum = (int16_t(x[2]) << 16) + (int16_t(x[3]) << 8) + int16_t(x[4]);
            const float temperature = (basenum / 10000.0f);
            const float humidity = (basenum % 1000) / 10.0f;
            const float battery_level = uint16_t(x[5]) / 1.0f;

            id(govee_2_temperature).publish_state(temperature);
            id(govee_2_humidity).publish_state(humidity);
            id(govee_2_battery).publish_state(battery_level);
  
    - mac_address: A4:C1:38:50:40:4E
      manufacturer_id: 'EC88'
      then:
        - lambda: |-
            uint16_t hum_lsb = x[3] + (x[4] << 8);
            float humidity= float(hum_lsb)/100.0;
            int16_t temp_lsb = x[1] + (x[2] << 8);
            float temperature = float(temp_lsb)/100.0;
            int16_t battery=x[5];

            id(govee_3_humidity).publish_state(humidity);
            id(govee_3_temperature).publish_state(temperature);
            id(govee_3_battery).publish_state(battery);

    - mac_address: A4:C1:38:40:40:25
      manufacturer_id: 'EC88'
      then:
        - lambda: |-
            uint16_t hum_lsb = x[3] + (x[4] << 8);
            float humidity= float(hum_lsb)/100.0;
            int16_t temp_lsb = x[1] + (x[2] << 8);
            float temperature = float(temp_lsb)/100.0;
            int16_t battery=x[5];

            id(govee_4_humidity).publish_state(humidity);
            id(govee_4_temperature).publish_state(temperature);
            id(govee_4_battery).publish_state(battery);

